name: flutter_style_expiring_todos
description: >-
  An analyzer plugin that enforces Flutter-style TODO comments with optional
  expiry conditions (// TODO(username)[condition]: message) and reports TODOs
  whose conditions are met.
version: 0.1.0
executables:
  flutter_style_expiring_todos_cli:
repository: https://github.com/keigomichi/flutter_style_expiring_todos
issue_tracker: https://github.com/keigomichi/flutter_style_expiring_todos/issues
topics:
  - analyzer-plugin
  - lint
  - static-analysis
  - todo
  - flutter
environment:
  sdk: ^3.11.0
dependencies:
  analyzer: ^14.1.0
  analysis_server_plugin: ^0.3.20
  args: ^2.7.0
  pub_semver: ^2.2.0
  yaml: ^3.1.3
dev_dependencies:
  analyzer_testing: ^0.3.4
  # test_core also permits 3.2.0, which cannot locate Dart 3's AOT frontend
  # server snapshot.
  frontend_server_client: ^4.0.0
  lints: ^6.1.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0
